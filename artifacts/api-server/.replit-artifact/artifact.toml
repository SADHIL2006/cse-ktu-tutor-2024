kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.env]
PYTHONPATH = "/home/runner/workspace"
PORT = "8080"

[services.development]
run = "uvicorn backend.main:app --host 0.0.0.0 --port 8080"

[services.production]

[services.production.build]
args = ["pip", "install", "-q", "-r", "backend/requirements.txt"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8080"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"
PYTHONPATH = "/home/runner/workspace"

[services.production.health.startup]
path = "/api/healthz"
