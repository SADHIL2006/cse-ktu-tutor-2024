kind = "web"
previewPath = "/"
title = "KTU AI Tutor"
version = "1.0.0"
id = "artifacts/ai-tutor"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "KTU AI Tutor"
paths = [ "/" ]
localPort = 5173

[services.development]
run = "pnpm --filter @workspace/ai-tutor run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-tutor", "run", "build" ]
publicDir = "artifacts/ai-tutor/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "5173"
BASE_PATH = "/"
