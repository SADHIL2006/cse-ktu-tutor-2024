<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KTU AI Tutor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: hsl(210, 33%, 99%);
      --fg: hsl(222, 47%, 11%);
      --border: hsl(214, 32%, 91%);
      --card: hsl(0, 0%, 100%);
      --muted: hsl(210, 40%, 96.1%);
      --muted-fg: hsl(215.4, 16.3%, 46.9%);
      --primary: hsl(226, 71%, 40%);
      --primary-fg: hsl(210, 40%, 98%);
      --secondary: hsl(210, 40%, 96.1%);
      --secondary-fg: hsl(222, 47%, 11%);
      --radius: 0.5rem;
      --font: 'Inter', sans-serif;
      --font-mono: 'Space Mono', monospace;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
    }

    .dark {
      --bg: hsl(222, 47%, 11%);
      --fg: hsl(210, 40%, 98%);
      --border: hsl(217.2, 32.6%, 17.5%);
      --card: hsl(222, 47%, 13%);
      --muted: hsl(217.2, 32.6%, 17.5%);
      --muted-fg: hsl(215, 20.2%, 65.1%);
      --primary: hsl(226, 71%, 55%);
      --primary-fg: hsl(210, 40%, 98%);
      --secondary: hsl(217.2, 32.6%, 17.5%);
      --secondary-fg: hsl(210, 40%, 98%);
    }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      transition: background 0.2s, color 0.2s;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 56rem;
      margin: 0 auto;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    /* ── Header ─────────────────────────────────────────────── */
    header {
      flex: none;
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1rem 0;
      backdrop-filter: blur(12px);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.5rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--fg);
    }

    .logo-badge {
      background: var(--primary);
      color: var(--primary-fg);
      font-size: 0.7rem;
      font-weight: 700;
      padding: 0.1rem 0.45rem;
      border-radius: calc(var(--radius) - 2px);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-pill {
      font-family: var(--font-mono);
      font-size: 0.625rem;
      background: var(--secondary);
      color: var(--secondary-fg);
      border: 1px solid var(--border);
      padding: 0.25rem 0.5rem;
      border-radius: var(--radius);
    }

    @media (max-width: 480px) { .status-pill { display: none; } }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .icon-btn:hover { background: color-mix(in srgb, var(--primary) 8%, transparent); border-color: color-mix(in srgb, var(--primary) 40%, transparent); }

    .share-btn {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.25rem 0.625rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .share-btn:hover { background: color-mix(in srgb, var(--primary) 8%, transparent); border-color: color-mix(in srgb, var(--primary) 40%, transparent); }

    /* ── Tab bar ─────────────────────────────────────────────── */
    nav {
      display: flex;
      gap: 0.125rem;
      overflow-x: auto;
      scrollbar-width: none;
      margin: 0 -0.25rem;
      padding: 0 0.25rem;
    }
    nav::-webkit-scrollbar { display: none; }

    .tab-btn {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 500;
      white-space: nowrap;
      flex-shrink: 0;
      border: none;
      border-bottom: 2px solid transparent;
      border-radius: calc(var(--radius)) calc(var(--radius)) 0 0;
      background: transparent;
      color: var(--muted-fg);
      cursor: pointer;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }
    .tab-btn.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: color-mix(in srgb, var(--primary) 6%, transparent);
    }
    .tab-btn:not(.active):hover { color: var(--fg); background: color-mix(in srgb, var(--muted) 60%, transparent); }
    .tab-btn svg { width: 1rem; height: 1rem; }
    .tab-short { display: none; }
    @media (max-width: 540px) { .tab-long { display: none; } .tab-short { display: inline; } }

    /* ── Main ────────────────────────────────────────────────── */
    main {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .tab-panel { display: none; flex: 1; flex-direction: column; overflow: hidden; height: 100%; }
    .tab-panel.active { display: flex; }

    /* ── Chat ────────────────────────────────────────────────── */
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .chat-empty {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2.5rem 1rem;
      animation: fadeIn 0.4s ease;
    }

    .empty-icon {
      width: 3.5rem;
      height: 3.5rem;
      background: var(--primary);
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.25rem;
      box-shadow: 0 4px 12px color-mix(in srgb, var(--primary) 30%, transparent);
    }

    .empty-icon svg { width: 1.5rem; height: 1.5rem; color: var(--primary-fg); }

    .chat-empty h2 { font-size: 1.35rem; font-weight: 700; margin-bottom: 0.5rem; }
    .chat-empty p { font-size: 0.875rem; color: var(--muted-fg); max-width: 22rem; margin-bottom: 2rem; }

    .prompt-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
      width: 100%;
      max-width: 36rem;
    }
    @media (max-width: 480px) { .prompt-grid { grid-template-columns: 1fr; } }

    .prompt-chip {
      text-align: left;
      padding: 0.75rem;
      border-radius: calc(var(--radius) + 4px);
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--fg);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      line-height: 1.4;
    }
    .prompt-chip:hover { border-color: color-mix(in srgb, var(--primary) 50%, transparent); background: color-mix(in srgb, var(--primary) 5%, transparent); }

    .msg-row { display: flex; animation: fadeSlideIn 0.3s ease; }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.assistant { justify-content: flex-start; }

    .bubble {
      max-width: 88%;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      font-size: 0.875rem;
      line-height: 1.6;
    }
    .bubble.user {
      background: var(--primary);
      color: var(--primary-fg);
      border-bottom-right-radius: 0.25rem;
    }
    .bubble.assistant {
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-bottom-left-radius: 0.25rem;
    }

    .agent-badge {
      display: inline-block;
      font-family: var(--font-mono);
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: var(--secondary);
      color: var(--secondary-fg);
      border: 1px solid var(--border);
      padding: 0.1rem 0.4rem;
      border-radius: calc(var(--radius) - 2px);
      margin-bottom: 0.5rem;
    }

    /* Markdown prose inside bubbles */
    .prose { color: inherit; }
    .prose p { margin: 0.4em 0; }
    .prose p:first-child { margin-top: 0; }
    .prose p:last-child { margin-bottom: 0; }
    .prose h1, .prose h2, .prose h3, .prose h4 { font-weight: 700; margin: 0.8em 0 0.3em; }
    .prose h1 { font-size: 1.15em; }
    .prose h2 { font-size: 1.05em; }
    .prose h3 { font-size: 1em; }
    .prose ul, .prose ol { padding-left: 1.25em; margin: 0.4em 0; }
    .prose li { margin: 0.2em 0; }
    .prose code { font-family: var(--font-mono); font-size: 0.82em; background: color-mix(in srgb, var(--muted) 80%, transparent); padding: 0.1em 0.35em; border-radius: 3px; }
    .prose pre { background: color-mix(in srgb, var(--muted) 80%, transparent); padding: 0.75em 1em; border-radius: var(--radius); overflow-x: auto; margin: 0.6em 0; }
    .prose pre code { background: none; padding: 0; font-size: 0.8em; }
    .prose strong { font-weight: 700; }
    .prose em { font-style: italic; }
    .prose blockquote { border-left: 3px solid var(--border); padding-left: 0.75em; color: var(--muted-fg); margin: 0.4em 0; }
    .prose table { border-collapse: collapse; width: 100%; margin: 0.6em 0; font-size: 0.85em; }
    .prose th, .prose td { border: 1px solid var(--border); padding: 0.4em 0.6em; }
    .prose th { font-weight: 700; background: var(--muted); }
    .prose a { color: var(--primary); text-decoration: underline; }

    .typing-bubble {
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 1rem;
      border-bottom-left-radius: 0.25rem;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      animation: fadeIn 0.3s ease;
    }

    .typing-dots { display: flex; gap: 0.25rem; }
    .typing-dot {
      width: 0.5rem;
      height: 0.5rem;
      background: color-mix(in srgb, var(--primary) 50%, transparent);
      border-radius: 50%;
      animation: bounce 1s infinite;
    }
    .typing-dot:nth-child(2) { animation-delay: 0.15s; }
    .typing-dot:nth-child(3) { animation-delay: 0.3s; }

    .typing-label { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted-fg); }

    /* ── Chat input bar ──────────────────────────────────────── */
    .chat-input-bar {
      flex: none;
      padding: 0.75rem;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }

    .input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 0.5rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 4px);
      overflow: hidden;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-wrapper:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 15%, transparent);
    }

    textarea {
      flex: 1;
      min-height: 3rem;
      max-height: 8rem;
      padding: 0.75rem;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      font-family: var(--font);
      font-size: 0.875rem;
      color: var(--fg);
      line-height: 1.5;
      field-sizing: content;
    }
    textarea::placeholder { color: var(--muted-fg); }
    textarea:disabled { opacity: 0.5; }

    .send-btn {
      margin: 0 0.375rem 0.375rem 0;
      width: 2.25rem;
      height: 2.25rem;
      border-radius: var(--radius);
      border: none;
      background: var(--primary);
      color: var(--primary-fg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s, opacity 0.15s;
    }
    .send-btn:hover:not(:disabled) { background: color-mix(in srgb, var(--primary) 85%, #000); }
    .send-btn:active:not(:disabled) { transform: scale(0.93); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .send-btn svg { width: 1rem; height: 1rem; }

    .input-hint {
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.625rem;
      color: var(--muted-fg);
      margin-top: 0.375rem;
    }

    /* ── Tool Panel ──────────────────────────────────────────── */
    .tool-panel {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .tool-header { display: flex; align-items: flex-start; gap: 1rem; }
    .tool-icon {
      width: 3rem;
      height: 3rem;
      background: var(--primary);
      border-radius: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 2px 8px color-mix(in srgb, var(--primary) 30%, transparent);
    }
    .tool-icon svg { width: 1.25rem; height: 1.25rem; color: var(--primary-fg); }
    .tool-header h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.25rem; }
    .tool-header p { font-size: 0.8125rem; color: var(--muted-fg); line-height: 1.5; }

    .tool-textarea {
      width: 100%;
      min-height: 5rem;
      padding: 0.75rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      font-family: var(--font);
      font-size: 0.875rem;
      resize: none;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .tool-textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--primary) 15%, transparent);
    }
    .tool-textarea:disabled { opacity: 0.5; }

    .generate-btn {
      width: 100%;
      padding: 0.65rem 1rem;
      border-radius: var(--radius);
      border: none;
      background: var(--primary);
      color: var(--primary-fg);
      font-family: var(--font);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.15s, opacity 0.15s;
    }
    .generate-btn:hover:not(:disabled) { background: color-mix(in srgb, var(--primary) 85%, #000); }
    .generate-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .generate-btn svg { width: 1rem; height: 1rem; }

    .examples-label {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted-fg);
      margin-bottom: 0.5rem;
    }

    .chip-list { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .chip {
      font-size: 0.75rem;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .chip:hover { background: color-mix(in srgb, var(--primary) 5%, transparent); border-color: color-mix(in srgb, var(--primary) 40%, transparent); }

    /* ── Skeleton ────────────────────────────────────────────── */
    .skeleton-block {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      animation: fadeIn 0.3s ease;
    }
    .skeleton-line {
      height: 1rem;
      background: var(--muted);
      border-radius: 9999px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    /* ── Result card ─────────────────────────────────────────── */
    .result-card {
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 4px);
      background: var(--card);
      box-shadow: var(--shadow);
      overflow: hidden;
      animation: fadeSlideIn 0.35s ease;
    }

    .result-card-header {
      padding: 0.625rem 1rem;
      border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--muted) 40%, transparent);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .result-meta { display: flex; align-items: center; gap: 0.5rem; }
    .result-label { font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted-fg); }

    .copy-btn {
      display: flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.25rem 0.625rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--fg);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .copy-btn:hover { background: color-mix(in srgb, var(--primary) 5%, transparent); border-color: color-mix(in srgb, var(--primary) 40%, transparent); }
    .copy-btn svg { width: 0.875rem; height: 0.875rem; }
    .copy-btn.copied { color: hsl(142, 71%, 35%); }

    .result-body {
      padding: 1.25rem;
      font-size: 0.875rem;
      line-height: 1.65;
    }

    /* ── Share dropdown ──────────────────────────────────────── */
    .share-dropdown-wrap { position: relative; }
    .share-dropdown {
      position: absolute;
      right: 0;
      top: calc(100% + 0.5rem);
      width: 16rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: calc(var(--radius) + 4px);
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      padding: 0.75rem;
      z-index: 50;
      animation: fadeSlideIn 0.2s ease;
    }
    .share-dropdown-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
    .share-dropdown-title { font-size: 0.75rem; font-weight: 600; }
    .share-url-box {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      color: var(--muted-fg);
      background: var(--muted);
      border-radius: var(--radius);
      padding: 0.5rem 0.625rem;
      margin-bottom: 0.75rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      user-select: all;
    }
    .share-action {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      padding: 0.625rem 0.75rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: transparent;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      width: 100%;
      text-align: left;
      margin-bottom: 0.5rem;
    }
    .share-action:last-child { margin-bottom: 0; }
    .share-action:hover { background: color-mix(in srgb, var(--primary) 5%, transparent); border-color: color-mix(in srgb, var(--primary) 30%, transparent); }
    .share-action.whatsapp:hover { background: color-mix(in srgb, hsl(142,71%,35%) 5%, transparent); border-color: color-mix(in srgb, hsl(142,71%,35%) 30%, transparent); }
    .share-action-icon { width: 1rem; height: 1rem; flex-shrink: 0; }
    .share-action-text strong { display: block; font-size: 0.75rem; font-weight: 500; color: var(--fg); }
    .share-action-text small { font-size: 0.6rem; color: var(--muted-fg); }

    /* ── Spinner ─────────────────────────────────────────────── */
    .spin { animation: spin 0.8s linear infinite; }

    /* ── Animations ──────────────────────────────────────────── */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeSlideIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="app">
  <!-- Header -->
  <header>
    <div class="header-row">
      <div class="logo">
        <span class="logo-badge">KTU</span>
        AI Tutor
      </div>
      <div class="header-actions">
        <span class="status-pill">System: Online</span>
        <button class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode">
          <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>

<script>
// ── Dark mode ──────────────────────────────────────────────────────────────────
(function () {
  const root = document.documentElement;
  const stored = localStorage.getItem('ktu-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const dark = stored ? stored === 'dark' : prefersDark;
  if (dark) root.classList.add('dark');

  const moonIcon = document.getElementById('icon-moon');
  const sunIcon  = document.getElementById('icon-sun');

  function applyIcons(isDark) {
    moonIcon.style.display = isDark ? 'none' : '';
    sunIcon.style.display  = isDark ? '' : 'none';
  }
  applyIcons(dark);

  document.getElementById('theme-toggle').addEventListener('click', () => {
    const isDark = root.classList.toggle('dark');
    localStorage.setItem('ktu-theme', isDark ? 'dark' : 'light');
    applyIcons(isDark);
  });
})();

// ── Marked config ──────────────────────────────────────────────────────────────
marked.setOptions({ breaks: true, gfm: true });

// ── API helper ─────────────────────────────────────────────────────────────────
async function askTutor(question) {
  const res = await fetch('/api/ask', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ question }),
  });
  if (!res.ok) throw new Error('Request failed');
  return res.json(); // { answer, agent_used }
}

// ── Tab switching ──────────────────────────────────────────────────────────────
const tabBtns  = document.querySelectorAll('.tab-btn');
const panels   = document.querySelectorAll('.tab-panel');

tabBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    panels.forEach(p  => p.classList.toggle('active', p.id === 'panel-' + tab));
  });
});

// ── Chat ───────────────────────────────────────────────────────────────────────
const CHAT_PROMPTS = [
  'Explain the difference between process and thread in OS',
  'What is normalization in DBMS? Give an example',
  'Explain TCP/IP model with layers',
  'What is dynamic programming? How does it differ from recursion?',
];

const chatMessages = document.getElementById('chat-messages');
const chatEmpty    = document.getElementById('chat-empty');
const promptGrid   = document.getElementById('prompt-grid');
const chatInput    = document.getElementById('chat-input');
const sendBtn      = document.getElementById('send-btn');
let chatBusy = false;

// Build prompt chips
CHAT_PROMPTS.forEach(p => {
  const btn = document.createElement('button');
  btn.className = 'prompt-chip';
  btn.textContent = p;
  btn.addEventListener('click', () => sendChat(p));
  promptGrid.appendChild(btn);
});

chatInput.addEventListener('input', () => {
  sendBtn.disabled = !chatInput.value.trim() || chatBusy;
});

chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(chatInput.value); }
});

sendBtn.addEventListener('click', () => sendChat(chatInput.value));

function renderMd(text) {
  const div = document.createElement('div');
  div.className = 'prose';
  div.innerHTML = marked.parse(text);
  return div;
}

function appendMsg(role, content, agentUsed) {
  // Remove empty state
  if (chatEmpty) chatEmpty.remove();

  const row = document.createElement('div');
  row.className = 'msg-row ' + role;

  const bubble = document.createElement('div');
  bubble.className = 'bubble ' + role;

  if (role === 'assistant' && agentUsed) {
    const badge = document.createElement('div');
    badge.className = 'agent-badge';
    badge.textContent = agentUsed;
    bubble.appendChild(badge);
  }

  if (role === 'user') {
    const p = document.createElement('p');
    p.style.margin = '0';
    p.style.whiteSpace = 'pre-wrap';
    p.textContent = content;
    bubble.appendChild(p);
  } else {
    bubble.appendChild(renderMd(content));
  }

  row.appendChild(bubble);
  chatMessages.appendChild(row);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function addTypingIndicator() {
  const row = document.createElement('div');
  row.className = 'msg-row assistant';
  row.id = 'typing-row';
  const bubble = document.createElement('div');
  bubble.className = 'typing-bubble';
  bubble.innerHTML = `
    <div class="typing-dots">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
    <span class="typing-label">Thinking...</span>`;
  row.appendChild(bubble);
  chatMessages.appendChild(row);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

function removeTypingIndicator() {
  const el = document.getElementById('typing-row');
  if (el) el.remove();
}

async function sendChat(text) {
  if (!text.trim() || chatBusy) return;
  chatBusy = true;
  chatInput.value = '';
  chatInput.disabled = true;
  sendBtn.disabled = true;

  appendMsg('user', text.trim());
  addTypingIndicator();

  try {
    const data = await askTutor(text.trim());
    removeTypingIndicator();
    appendMsg('assistant', data.answer, data.agent_used);
  } catch {
    removeTypingIndicator();
    appendMsg('assistant', 'Something went wrong. Please try again.', 'Error');
  }

  chatBusy = false;
  chatInput.disabled = false;
  sendBtn.disabled = !chatInput.value.trim();
  chatInput.focus();
}

    examples: ['Computer Networks', 'Data Structures', 'Operating Systems', 'DBMS'],

function makeIcon(pathContent) {
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${pathContent}</svg>`;
}

const spinnerSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="spin" width="16" height="16"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>`;

function buildToolPanel(tab, cfg) {
  const panel = document.getElementById('panel-' + tab);

  const wrap = document.createElement('div');
  wrap.className = 'tool-panel';

  // Header
  const header = document.createElement('div');
  header.className = 'tool-header';
  header.innerHTML = `
    <div class="tool-icon">${makeIcon(cfg.iconPath)}</div>
    <div>
      <h2>${cfg.heading}</h2>
      <p>${cfg.description}</p>
    </div>`;
  wrap.appendChild(header);

  // Input area
  const inputWrap = document.createElement('div');
  inputWrap.style.display = 'flex';
  inputWrap.style.flexDirection = 'column';
  inputWrap.style.gap = '0.5rem';

  const ta = document.createElement('textarea');
  ta.className = 'tool-textarea';
  ta.placeholder = cfg.placeholder;
  ta.rows = 4;
  inputWrap.appendChild(ta);

  const genBtn = document.createElement('button');
  genBtn.className = 'generate-btn';
  genBtn.innerHTML = cfg.buttonLabel;
  inputWrap.appendChild(genBtn);
  wrap.appendChild(inputWrap);

  // Examples
  const exWrap = document.createElement('div');
  exWrap.id = tab + '-examples';

  const exLabel = document.createElement('p');
  exLabel.className = 'examples-label';
  exLabel.textContent = 'Try an example';
  exWrap.appendChild(exLabel);

  const chipList = document.createElement('div');
  chipList.className = 'chip-list';
  cfg.examples.forEach(ex => {
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.textContent = ex;
    chip.addEventListener('click', () => { ta.value = ex; generate(ex); });
    chipList.appendChild(chip);
  });
  exWrap.appendChild(chipList);
  wrap.appendChild(exWrap);

  // Skeleton (hidden)
  const skeleton = document.createElement('div');
  skeleton.className = 'skeleton-block';
  skeleton.id = tab + '-skeleton';
  skeleton.style.display = 'none';
  skeleton.innerHTML = `
    <div class="skeleton-line" style="width:75%"></div>
    <div class="skeleton-line" style="width:100%"></div>
    <div class="skeleton-line" style="width:83%"></div>
    <div class="skeleton-line" style="width:100%"></div>
    <div class="skeleton-line" style="width:60%"></div>`;
  wrap.appendChild(skeleton);

  // Result (hidden)
  const resultWrap = document.createElement('div');
  resultWrap.id = tab + '-result';
  resultWrap.style.display = 'none';
  wrap.appendChild(resultWrap);

  panel.appendChild(wrap);

  let busy = false;

  async function generate(overrideTopic) {
    const topic = (overrideTopic ?? ta.value).trim();
    if (!topic || busy) return;
    busy = true;
    genBtn.disabled = true;
    ta.disabled = true;
    genBtn.innerHTML = spinnerSvg + ' Generating…';
    exWrap.style.display = 'none';
    skeleton.style.display = 'flex';
    resultWrap.style.display = 'none';

    try {
      const data = await askTutor(cfg.buildQuestion(topic));
      skeleton.style.display = 'none';
      buildResult(resultWrap, tab, data.answer, data.agent_used);
      resultWrap.style.display = 'block';
      resultWrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch {
      skeleton.style.display = 'none';
      buildResult(resultWrap, tab, 'Something went wrong. Please try again.', null);
      resultWrap.style.display = 'block';
    }

    genBtn.innerHTML = cfg.buttonLabel;
    genBtn.disabled = false;
    ta.disabled = false;
    busy = false;
  }

  genBtn.addEventListener('click', () => generate());
  ta.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); generate(); }
  });
  ta.addEventListener('input', () => { genBtn.disabled = !ta.value.trim() || busy; });
}

function buildResult(container, tab, markdown, agentUsed) {
  container.innerHTML = '';
  const card = document.createElement('div');
  card.className = 'result-card';

  const cardHeader = document.createElement('div');
  cardHeader.className = 'result-card-header';

  const meta = document.createElement('div');
  meta.className = 'result-meta';
  if (agentUsed) {
    const badge = document.createElement('span');
    badge.className = 'agent-badge';
    badge.textContent = agentUsed;
    meta.appendChild(badge);
  }
  const label = document.createElement('span');
  label.className = 'result-label';
  label.textContent = 'Generated result';
  meta.appendChild(label);

  const copyBtn = document.createElement('button');
  copyBtn.className = 'copy-btn';
  copyBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy`;

  copyBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(markdown); }
    catch {
      const el = document.createElement('textarea');
      el.value = markdown;
      document.body.appendChild(el);
      el.select();
      document.execCommand('copy');
      document.body.removeChild(el);
    }
    copyBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:hsl(142,71%,35%)"><polyline points="20 6 9 17 4 12"/></svg><span style="color:hsl(142,71%,35%)">Copied!</span>`;
    setTimeout(() => { copyBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy`; }, 2000);
  });

  cardHeader.appendChild(meta);
  cardHeader.appendChild(copyBtn);
  card.appendChild(cardHeader);

  const body = document.createElement('div');
  body.className = 'result-body prose';
  body.innerHTML = marked.parse(markdown);
  card.appendChild(body);

  container.appendChild(card);
}

// Build all tool panels
Object.entries(TOOL_CONFIGS).forEach(([tab, cfg]) => buildToolPanel(tab, cfg));

// ── Share ──────────────────────────────────────────────────────────────────────
const shareBtn      = document.getElementById('share-btn');
const shareDropdown = document.getElementById('share-dropdown');
const shareClose    = document.getElementById('share-close');
const shareUrlBox   = document.getElementById('share-url-box');
const shareCopyLink = document.getElementById('share-copy-link');
const shareCopyLabel= document.getElementById('share-copy-label');
const shareWa       = document.getElementById('share-wa');

function openShare() {
  const url = window.location.href;
  shareUrlBox.textContent = url;
  shareWa.href = `https://wa.me/?text=${encodeURIComponent('Check out KTU AI Tutor — an AI-powered study assistant for KTU CSE students! ' + url)}`;
  shareDropdown.style.display = 'block';
}
function closeShare() { shareDropdown.style.display = 'none'; }

shareBtn.addEventListener('click', () => {
  if (navigator.share) {
    navigator.share({ title: 'KTU AI Tutor', text: 'AI-powered study assistant for KTU CSE students', url: window.location.href });
  } else {
    shareDropdown.style.display === 'none' ? openShare() : closeShare();
  }
});
shareClose.addEventListener('click', closeShare);
document.addEventListener('mousedown', e => {
  if (!shareBtn.closest('.share-dropdown-wrap').contains(e.target)) closeShare();
});

shareCopyLink.addEventListener('click', async () => {
  const url = window.location.href;
  try { await navigator.clipboard.writeText(url); }
  catch {
    const el = document.createElement('input');
    el.value = url;
    document.body.appendChild(el);
    el.select();
    document.execCommand('copy');
    document.body.removeChild(el);
  }
  shareCopyLabel.textContent = 'Copied!';
  setTimeout(() => { shareCopyLabel.textContent = 'Copy link'; closeShare(); }, 1800);
});

shareWa.addEventListener('click', closeShare);
</script>
</body>
